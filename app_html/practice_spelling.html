<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Practice - Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Score Board */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7f7f7;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #555;
            font-size: 1em;
        }

        select {
            padding: 12px 15px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Practice Tab */
        .problem-container {
            background: #f9f9f9;
            border: 3px solid #667eea;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .word-display {
            text-align: center;
            margin-bottom: 30px;
        }

        .word-image {
            font-size: 5em;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-hint {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .word-definition {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 20px;
            padding: 15px;
            background: #e6f3ff;
            border-radius: 8px;
            border-left: 4px solid #4299e1;
        }

        .spelling-input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .spelling-input {
            font-size: 2em;
            text-align: center;
            border: 3px solid #ddd;
            border-radius: 10px;
            padding: 15px 20px;
            width: 100%;
            max-width: 400px;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.2em;
            text-transform: lowercase;
            transition: all 0.3s;
        }

        .spelling-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .spelling-input.correct {
            border-color: #48bb78;
            background-color: #f0fff4;
        }

        .spelling-input.incorrect {
            border-color: #f56565;
            background-color: #fff5f5;
        }

        .letter-hint {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .letter-box {
            width: 40px;
            height: 40px;
            border: 2px solid #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            background: white;
        }

        .letter-box.revealed {
            background: #667eea;
            color: white;
        }

        .letter-box.correct {
            background: #48bb78;
            border-color: #48bb78;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            flex: 1;
            min-width: 120px;
        }

        .btn-submit {
            background: #667eea;
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-hint {
            background: #f59e0b;
            color: white;
        }

        .btn-hint:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-sound {
            background: #10b981;
            color: white;
            font-size: 1.3em;
        }

        .btn-sound:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-next {
            background: #48bb78;
            color: white;
        }

        .btn-next:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-new {
            background: #ed8936;
            color: white;
        }

        .btn-new:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }

        .feedback {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }

        .correct-answer {
            text-align: center;
            margin-top: 10px;
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
        }

        /* Learning Tab */
        .learning-container {
            text-align: center;
        }

        .word-builder {
            background: #f9f9f9;
            border: 3px solid #667eea;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }

        .word-slots {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
            min-height: 80px;
        }

        .letter-slot {
            width: 60px;
            height: 60px;
            border: 3px dashed #667eea;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            background: white;
            transition: all 0.3s;
        }

        .letter-slot.filled {
            border: 3px solid #48bb78;
            background: #f0fff4;
            color: #22543d;
        }

        .letter-tiles {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .letter-tile {
            width: 50px;
            height: 50px;
            border: 2px solid #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .letter-tile:hover {
            background: #e6f3ff;
            transform: scale(1.1);
        }

        .letter-tile.used {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }

        .word-breakdown {
            background: #fff9e6;
            border: 2px solid #fbbf24;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .syllable {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            background: #fef3c7;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            color: #78350f;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .container {
                padding: 15px;
                max-width: 100%;
            }

            h1 {
                font-size: 1.4em;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                border-radius: 8px;
                margin-bottom: 5px;
            }

            .word-image {
                font-size: 4em;
            }

            .spelling-input {
                font-size: 1.5em;
                padding: 12px 15px;
            }

            .letter-box {
                width: 35px;
                height: 35px;
                font-size: 1.2em;
            }

            .letter-slot {
                width: 50px;
                height: 50px;
                font-size: 1.5em;
            }

            .letter-tile {
                width: 45px;
                height: 45px;
                font-size: 1.5em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spelling Practice</h1>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('practice')">Practice</button>
            <button class="tab" onclick="switchTab('learning')">Learning</button>
        </div>

        <!-- Practice Tab -->
        <div id="practiceTab" class="tab-content active">
            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Correct</div>
                    <div class="score-value" id="correct">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Wrong</div>
                    <div class="score-value" id="wrong">0</div>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="category">Category:</label>
                    <select id="category">
                        <option value="animals">Animals</option>
                        <option value="colors">Colors</option>
                        <option value="food">Food</option>
                        <option value="body">Body Parts</option>
                        <option value="nature">Nature</option>
                        <option value="school">School</option>
                        <option value="family">Family</option>
                        <option value="actions">Actions</option>
                        <option value="numbers">Numbers</option>
                        <option value="shapes">Shapes</option>
                        <option value="weather">Weather</option>
                        <option value="transportation">Transportation</option>
                        <option value="clothing">Clothing</option>
                        <option value="sports">Sports</option>
                        <option value="toys">Toys</option>
                        <option value="feelings">Feelings</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="easy">Easy (3-4 letters)</option>
                        <option value="medium" selected>Medium (5-6 letters)</option>
                        <option value="hard">Hard (7+ letters)</option>
                    </select>
                </div>
            </div>

            <div class="problem-container">
                <div class="word-display">
                    <div class="word-image" id="wordImage"></div>
                    <div class="word-hint" id="wordHint"></div>
                    <div class="word-definition" id="wordDefinition"></div>
                </div>
                <div class="spelling-input-container">
                    <input type="text" 
                           class="spelling-input" 
                           id="spellingInput" 
                           placeholder="Type the word..."
                           autocomplete="off"
                           spellcheck="false">
                    <div class="letter-hint" id="letterHint"></div>
                </div>
                <div class="feedback" id="feedback"></div>
                <div class="correct-answer" id="correctAnswer"></div>
            </div>

            <div class="button-group">
                <button class="btn-sound" onclick="playSound()" title="Hear the word">🔊</button>
                <button class="btn-hint" id="hintBtn" onclick="showHint()">Hint</button>
                <button class="btn-submit" id="submitBtn" onclick="checkSpelling()">Submit</button>
                <button class="btn-next" id="nextBtn" onclick="generateNewWord()" style="display: none;">Next Word</button>
                <button class="btn-new" onclick="resetGame()">New Game</button>
            </div>
        </div>

        <!-- Learning Tab -->
        <div id="learningTab" class="tab-content">
            <div class="learning-container">
                <div class="controls">
                    <div class="control-group">
                        <label for="learningCategory">Category:</label>
                        <select id="learningCategory">
                            <option value="animals">Animals</option>
                            <option value="colors">Colors</option>
                            <option value="food">Food</option>
                            <option value="body">Body Parts</option>
                            <option value="nature">Nature</option>
                            <option value="school">School</option>
                            <option value="family">Family</option>
                            <option value="actions">Actions</option>
                            <option value="numbers">Numbers</option>
                            <option value="shapes">Shapes</option>
                            <option value="weather">Weather</option>
                            <option value="transportation">Transportation</option>
                            <option value="clothing">Clothing</option>
                            <option value="sports">Sports</option>
                            <option value="toys">Toys</option>
                            <option value="feelings">Feelings</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="learningDifficulty">Difficulty:</label>
                        <select id="learningDifficulty">
                            <option value="easy">Easy (3-4 letters)</option>
                            <option value="medium" selected>Medium (5-6 letters)</option>
                            <option value="hard">Hard (7+ letters)</option>
                        </select>
                    </div>
                </div>

                <button class="btn-submit" onclick="startLearning()" style="margin-bottom: 20px;">Start Learning</button>

                <div id="learningVisual" class="word-builder" style="display: none;">
                    <div class="word-display">
                        <div class="word-image" id="learningImage"></div>
                        <div class="word-hint" id="learningHint"></div>
                        <div class="word-definition" id="learningDefinition"></div>
                    </div>
                    <div class="word-breakdown" id="wordBreakdown"></div>
                    <div class="word-slots" id="wordSlots"></div>
                    <div class="letter-tiles" id="letterTiles"></div>
                    <div class="button-group">
                        <button class="btn-sound" onclick="playLearningSound()">🔊 Hear Word</button>
                        <button class="btn-submit" onclick="checkLearningWord()">Check</button>
                        <button class="btn-next" onclick="nextLearningWord()">Next Word</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // Practice Tab Variables
        let currentWord = null;

        let correctCount = 0;
        let wrongCount = 0;
        let isAnswered = false;
        let hintsUsed = 0;
        let revealedLetters = [];

        let usedTiles = [];

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            if (tabName === 'practice') {
                document.getElementById('practiceTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('learningTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }

        function getWordsByCategoryAndDifficulty(category, difficulty) {
            return wordDatabase[category]?.[difficulty] || [];
        }

        function generateNewWord() {
            const category = document.getElementById('category').value;
            const difficulty = document.getElementById('difficulty').value;
            const words = getWordsByCategoryAndDifficulty(category, difficulty);
            
            if (words.length === 0) {
                alert('No words available for this category and difficulty.');
                return;
            }

            currentWord = words[Math.floor(Math.random() * words.length)];
            hintsUsed = 0;
            revealedLetters = [];
            isAnswered = false; // Reset the answered flag

            // Update display
            document.getElementById('wordImage').textContent = currentWord.emoji;
            document.getElementById('wordHint').textContent = `Hint: ${currentWord.hint}`;
            document.getElementById('wordDefinition').textContent = currentWord.definition;

            // Reset input
            const input = document.getElementById('spellingInput');
            input.value = '';
            input.disabled = false;
            input.classList.remove('correct', 'incorrect');
            input.focus();

            // Reset feedback
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('correctAnswer').textContent = '';
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('hintBtn').disabled = false;

            // Create letter hint boxes
            createLetterHints();
        }

        function createLetterHints() {
            const container = document.getElementById('letterHint');
            container.innerHTML = '';
            
            for (let i = 0; i < currentWord.word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.textContent = '_';
                box.id = `letterBox${i}`;
                container.appendChild(box);
            }
        }

        function showHint() {
            if (!currentWord || hintsUsed >= currentWord.word.length) return;

            // Reveal one letter at a time
            const letterIndex = hintsUsed;
            const letterBox = document.getElementById(`letterBox${letterIndex}`);
            if (letterBox) {
                letterBox.textContent = currentWord.word[letterIndex].toUpperCase();
                letterBox.classList.add('revealed');
                revealedLetters.push(letterIndex);
                hintsUsed++;
            }

            // Disable hint button if all letters revealed
            if (hintsUsed >= currentWord.word.length) {
                document.getElementById('hintBtn').disabled = true;
            }
        }

        function playSound() {
            if (!currentWord) return;
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentWord.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert('Audio not supported in your browser.');
            }
        }

        function checkSpelling() {
            if (isAnswered || !currentWord) return;

            const userInput = document.getElementById('spellingInput').value.toLowerCase().trim();
            const input = document.getElementById('spellingInput');
            const feedback = document.getElementById('feedback');
            const correctAnswerDiv = document.getElementById('correctAnswer');
            const submitBtn = document.getElementById('submitBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (!userInput) {
                alert('Please type a word!');
                return;
            }

            isAnswered = true;
            input.disabled = true;
            document.getElementById('hintBtn').disabled = true;

            if (userInput === currentWord.word.toLowerCase()) {
                input.classList.add('correct');
                feedback.textContent = '✓ Correct! Great job! +5 points';
                feedback.className = 'feedback correct';
                score += 5;
                correctCount++;
                
                // Show all letters
                for (let i = 0; i < currentWord.word.length; i++) {
                    const box = document.getElementById(`letterBox${i}`);
                    if (box) {
                        box.textContent = currentWord.word[i].toUpperCase();
                        box.classList.add('correct');
                    }
                }
            } else {
                input.classList.add('incorrect');
                feedback.textContent = '✗ Incorrect. Try again! -2 points';
                feedback.className = 'feedback incorrect';
                correctAnswerDiv.textContent = `Correct spelling: ${currentWord.word}`;
                score -= 2;
                wrongCount++;
                if (score < 0) score = 0;

                // Show correct letters in green, wrong ones stay revealed
                for (let i = 0; i < currentWord.word.length; i++) {
                    const box = document.getElementById(`letterBox${i}`);
                    if (box) {
                        box.textContent = currentWord.word[i].toUpperCase();
                        if (userInput[i] && userInput[i] === currentWord.word[i]) {
                            box.classList.add('correct');
                        }
                    }
                }
            }

            updateScoreDisplay();
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        }

        function updateScoreDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('wrong').textContent = wrongCount;
        }

        function resetGame() {
            score = 0;
            correctCount = 0;
            wrongCount = 0;
            updateScoreDisplay();
            generateNewWord();
        }

        function startLearning() {
            const category = document.getElementById('learningCategory').value;
            const difficulty = document.getElementById('learningDifficulty').value;
            const words = getWordsByCategoryAndDifficulty(category, difficulty);
            
            if (words.length === 0) {

            document.getElementById('learningImage').textContent = learningWord.emoji;
            document.getElementById('learningHint').textContent = `Hint: ${learningWord.hint}`;
            document.getElementById('learningDefinition').textContent = learningWord.definition;

            // Show word breakdown
            showWordBreakdown();

            // Create word slots
            createWordSlots();

            // Create letter tiles
            createLetterTiles();

            document.getElementById('learningVisual').style.display = 'block';
        }

        function showWordBreakdown() {
            const word = learningWord.word;
            const container = document.getElementById('wordBreakdown');
            
            // Simple syllable breakdown (basic approach)
            let html = '<div style="margin-bottom: 10px;"><strong>Word Breakdown:</strong></div>';
            html += '<div>';
            
            // Break into syllables (simple heuristic)
            const syllables = breakIntoSyllables(word);
            syllables.forEach((syllable, index) => {
                html += `<span class="syllable">${syllable}</span>`;
                if (index < syllables.length - 1) {
                    html += ' + ';
                }
            });
            
            html += ` = <strong style="color: #667eea; font-size: 1.5em;">${word}</strong>`;
            html += '</div>';
            
            container.innerHTML = html;
        }

        function breakIntoSyllables(word) {
            // Simple syllable breakdown for elementary words
            const vowels = 'aeiou';
            let syllables = [];
            let currentSyllable = '';
            
            for (let i = 0; i < word.length; i++) {
                currentSyllable += word[i];
                if (vowels.includes(word[i].toLowerCase()) && i < word.length - 1) {
                    if (!vowels.includes(word[i + 1].toLowerCase())) {
                        syllables.push(currentSyllable);
                        currentSyllable = '';
                    }
                }
            }
            
            if (currentSyllable) {
                if (syllables.length > 0) {
                    syllables[syllables.length - 1] += currentSyllable;
                } else {
                    syllables.push(currentSyllable);
                }
            }
            
            return syllables.length > 0 ? syllables : [word];
        }

        function createWordSlots() {
            const container = document.getElementById('wordSlots');
            container.innerHTML = '';
            
            for (let i = 0; i < learningWord.word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                slot.id = `slot${i}`;
                slot.dataset.index = i;
                container.appendChild(slot);
            }
        }

        function createLetterTiles() {
            const container = document.getElementById('letterTiles');
            container.innerHTML = '';
            
            // Create tiles with correct letters plus some distractors
            const word = learningWord.word;
            const letters = word.split('').map(l => l.toUpperCase());
            
            // Add some random letters as distractors
            const allLetters = [...letters];
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            const neededDistractors = Math.max(3, Math.floor(word.length * 0.5));
            
            for (let i = 0; i < neededDistractors; i++) {
                const randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!allLetters.includes(randomLetter)) {
                    allLetters.push(randomLetter);
                }
            }
            
            // Shuffle letters
            allLetters.sort(() => Math.random() - 0.5);
            
            allLetters.forEach((letter, index) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.textContent = letter;
                tile.id = `tile${index}`;
                tile.dataset.letter = letter;
                tile.onclick = () => selectTile(tile);
                container.appendChild(tile);
            });
        }

        function selectTile(tile) {
            if (tile.classList.contains('used')) return;

            // Find first empty slot
            const emptySlot = Array.from(document.querySelectorAll('.letter-slot'))
                .find(slot => !slot.classList.contains('filled'));
            
            if (emptySlot) {
                emptySlot.textContent = tile.dataset.letter;
                emptySlot.classList.add('filled');
                tile.classList.add('used');
                usedTiles.push({ tile, slot: emptySlot });
            }
        }

        function checkLearningWord() {
            const slots = Array.from(document.querySelectorAll('.letter-slot'));
            const userWord = slots.map(slot => slot.textContent || '').join('').toLowerCase();
            
            if (userWord.length !== learningWord.word.length) {
                alert('Please fill all the slots!');
                return;
            }

            if (userWord === learningWord.word.toLowerCase()) {
                alert('✓ Correct! Great job!');
                // Mark all as correct
                slots.forEach(slot => {
                    slot.style.borderColor = '#48bb78';
                    slot.style.background = '#f0fff4';
                });
            } else {
                alert('Not quite right. Try again!');
                // Clear and reset
                slots.forEach(slot => {
                    slot.textContent = '';
                    slot.classList.remove('filled');
                });
                usedTiles.forEach(({ tile }) => {
                    tile.classList.remove('used');
                });
                usedTiles = [];
            }
        }

        function nextLearningWord() {
            startLearning();
        }

        function playLearningSound() {
            if (!learningWord) return;
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(learningWord.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }
        }

        // Allow Enter key to submit
        document.getElementById('spellingInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isAnswered) {
                checkSpelling();
            }
        });

        // Generate new word when category or difficulty changes
        document.getElementById('category').addEventListener('change', function() {
            if (!isAnswered) {
                generateNewWord();
            }
        });

        document.getElementById('difficulty').addEventListener('change', function() {
            if (!isAnswered) {
                generateNewWord();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            generateNewWord();
        });
