<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Practice - Interactive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .home-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #f5576c;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            z-index: 1000;
        }

        .home-button:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: #f5576c;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Score Board (Practice Tab) */
        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7f7f7;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #f5576c;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #555;
            font-size: 1em;
        }

        select {
            padding: 12px 15px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:hover {
            border-color: #f5576c;
        }

        select:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .problem-container {
            background: #f9f9f9;
            border: 3px solid #f5576c;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .problem-display {
            font-family: 'Courier New', monospace;
            color: #333;
            margin-bottom: 15px;
        }

        .multiplication-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 8px 0;
            min-height: 50px;
        }

        .multiplication-number {
            text-align: right;
            font-size: 2.5em;
            padding-right: 10px;
            min-width: 150px;
            white-space: pre;
        }

        .multiplication-operator {
            font-weight: bold;
            color: #f5576c;
            font-size: 2.5em;
            margin-right: 10px;
            min-width: 30px;
            text-align: center;
        }

        .answer-line {
            border-top: 2px solid #333;
            margin-top: 10px;
            padding-top: 10px;
        }

        .answer-input-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .answer-input {
            font-family: 'Courier New', monospace;
            font-size: 2.5em;
            text-align: right;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px 15px;
            width: 200px;
            transition: border-color 0.3s;
        }

        .answer-input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .answer-input.correct {
            border-color: #48bb78;
            background-color: #f0fff4;
        }

        .answer-input.incorrect {
            border-color: #f56565;
            background-color: #fff5f5;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            flex: 1;
            min-width: 120px;
        }

        .btn-submit {
            background: #f5576c;
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-explain {
            background: #9f7aea;
            color: white;
        }

        .btn-explain:hover {
            background: #805ad5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(159, 122, 234, 0.4);
        }

        .btn-next {
            background: #48bb78;
            color: white;
        }

        .btn-next:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-new {
            background: #ed8936;
            color: white;
        }

        .btn-new:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(237, 137, 54, 0.4);
        }

        .btn-prev {
            background: #4299e1;
            color: white;
        }

        .btn-prev:hover {
            background: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.4);
        }

        .feedback {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }

        .feedback.incorrect {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }

        .correct-answer {
            text-align: center;
            margin-top: 10px;
            font-size: 1.1em;
            color: #666;
        }

        .explanation-panel {
            background: #fff9e6;
            border: 2px solid #fbbf24;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .explanation-panel.show {
            display: block;
        }

        .explanation-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 15px;
            text-align: center;
        }

        .explanation-step {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #fbbf24;
        }

        .explanation-step-title {
            font-weight: bold;
            color: #78350f;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .explanation-step-content {
            font-size: 1.1em;
            color: #333;
            line-height: 1.8;
        }

        .step-number {
            display: inline-block;
            background: #f5576c;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            margin-right: 10px;
        }

        /* Learning Tab Styles */
        .learning-container {
            text-align: center;
        }

        .learning-controls {
            margin-bottom: 30px;
        }

        .learning-select {
            padding: 15px 25px;
            font-size: 1.2em;
            border: 3px solid #f5576c;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-weight: bold;
            color: #333;
        }

        .learning-visual {
            background: #f9f9f9;
            border: 3px solid #4299e1;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            min-height: 400px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .group-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .groups-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: flex-start;
            margin: 20px 0;
            max-width: 100%;
        }

        .group-box {
            background: white;
            border: 3px solid #4299e1;
            border-radius: 10px;
            padding: 10px;
            min-width: 100px;
            max-width: 200px;
            text-align: center;
            flex: 0 1 auto;
        }

        .group-label {
            font-weight: bold;
            color: #4299e1;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .group-items {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            min-height: 60px;
            max-width: 100%;
        }

        .item-dot {
            width: 25px;
            height: 25px;
            background: #4299e1;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .item-emoji {
            display: inline-block;
            flex-shrink: 0;
            text-align: center;
            line-height: 1;
        }

        .multiplication-equation {
            font-size: 2em;
            font-weight: bold;
            color: #f5576c;
            margin: 20px 0;
            padding: 15px;
            background: #fff5f5;
            border-radius: 10px;
        }

        .learning-navigation {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .learning-info {
            background: #e6f3ff;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #4299e1;
        }

        /* Array/Grid Visualization */
        .array-grid {
            display: inline-grid;
            gap: 4px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            margin: 10px 0;
            justify-content: center;
        }

        .array-cell {
            width: 30px;
            height: 30px;
            background: #f5576c;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .array-label {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
            color: #555;
        }

        /* Skip counting visualization */
        .skip-counting {
            background: #e6f3ff;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #4299e1;
        }

        .skip-number {
            display: inline-block;
            background: #4299e1;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 3px;
            font-weight: bold;
        }

        /* Repeated addition */
        .repeated-addition {
            background: #f0fff4;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #48bb78;
        }

        .addition-step {
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .home-button {
                position: relative;
                top: auto;
                left: auto;
                margin-bottom: 15px;
                display: block;
                text-align: center;
            }

            .container {
                padding: 15px;
                max-width: 100%;
            }

            h1 {
                font-size: 1.4em;
                margin-bottom: 15px;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                border-radius: 8px;
                margin-bottom: 5px;
            }

            .score-board {
                padding: 12px 10px;
                margin-bottom: 20px;
            }

            .score-value {
                font-size: 1.4em;
            }

            .controls {
                gap: 15px;
                margin-bottom: 20px;
            }

            .control-group {
                flex: 1;
                min-width: 140px;
            }

            .problem-container {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            .multiplication-number {
                font-size: 2em;
                min-width: 120px;
            }

            .multiplication-operator {
                font-size: 2em;
            }

            .answer-input {
                font-size: 1.8em;
                width: 100%;
                max-width: 180px;
                padding: 8px 12px;
            }

            .button-group {
                flex-direction: column;
                gap: 10px;
            }

            button {
                width: 100%;
                padding: 12px 20px;
                font-size: 1em;
            }

            .learning-controls > div {
                flex-direction: column;
            }

            .learning-controls > div > div {
                min-width: 100% !important;
            }

            .groups-container {
                gap: 10px;
            }

            .group-box {
                min-width: 100px;
                padding: 10px;
            }

            .item-dot {
                /* Size will be set dynamically */
            }

            .multiplication-equation {
                font-size: 1.5em;
            }

            .array-cell {
                width: 25px;
                height: 25px;
                font-size: 0.8em;
            }

            .explanation-panel {
                padding: 15px;
            }

            .explanation-title {
                font-size: 1.1em;
            }

            .explanation-step {
                padding: 10px;
            }

            .explanation-step-content {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <a href="../README.md" class="home-button">🏠 Home</a>
    <div class="container">
        <h1>Multiplication Practice</h1>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('learning')">Learning</button>
            <button class="tab" onclick="switchTab('practice')">Practice</button>
        </div>

        <!-- Learning Tab -->
        <div id="learningTab" class="tab-content active">
            <div class="learning-container">
                <div class="learning-controls">
                    <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label for="learningNumber" style="display: block; margin-bottom: 10px; font-size: 1.2em; color: #555;">
                                Choose a number:
                            </label>
                            <select id="learningNumber" class="learning-select" onchange="startLearning()" style="width: 100%;">
                                <option value="">Select a number...</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                                <option value="16">16</option>
                                <option value="17">17</option>
                                <option value="18">18</option>
                                <option value="19">19</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label for="symbolSelector" style="display: block; margin-bottom: 10px; font-size: 1.2em; color: #555;">
                                Choose a symbol:
                            </label>
                            <select id="symbolSelector" class="learning-select" onchange="updateSymbol()" style="width: 100%;">
                                <option value="dot">● Dot</option>
                                <option value="😊">😊 Happy Face</option>
                                <option value="😄">😄 Big Smile</option>
                                <option value="😃">😃 Grinning</option>
                                <option value="🤪">🤪 Silly Face</option>
                                <option value="🐶">🐶 Dog</option>
                                <option value="🐱">🐱 Cat</option>
                                <option value="🐯">🐯 Tiger</option>
                                <option value="🦖">🦖 Dinosaur</option>
                                <option value="🐻">🐻 Bear</option>
                                <option value="🐰">🐰 Rabbit</option>
                                <option value="🐸">🐸 Frog</option>
                                <option value="🦄">🦄 Unicorn</option>
                                <option value="⭐">⭐ Star</option>
                                <option value="🎈">🎈 Balloon</option>
                                <option value="⚽">⚽ Ball</option>
                                <option value="🎾">🎾 Tennis Ball</option>
                                <option value="🏀">🏀 Basketball</option>
                                <option value="🎯">🎯 Target</option>
                                <option value="🧸">🧸 Teddy Bear</option>
                                <option value="🎁">🎁 Gift</option>
                                <option value="🍎">🍎 Apple</option>
                                <option value="🍕">🍕 Pizza</option>
                                <option value="🍰">🍰 Cake</option>
                                <option value="🎨">🎨 Art</option>
                                <option value="🚗">🚗 Car</option>
                                <option value="✈️">✈️ Airplane</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="learningVisual" class="learning-visual" style="display: none;">
                    <div class="group-title" id="groupTitle"></div>
                    <div class="multiplication-equation" id="multiplicationEquation"></div>
                    <div class="groups-container" id="groupsContainer"></div>
                    <div class="learning-info" id="learningInfo"></div>
                    <div class="learning-navigation">
                        <button class="btn-prev" id="prevBtn" onclick="previousGroup()" style="display: none;">Previous</button>
                        <button class="btn-next" id="nextBtn" onclick="nextGroup()">Next</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Practice Tab -->
        <div id="practiceTab" class="tab-content">
            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Correct</div>
                    <div class="score-value" id="correct">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Wrong</div>
                    <div class="score-value" id="wrong">0</div>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="digitType">Number Type:</label>
                    <select id="digitType">
                        <option value="1digit">1 Digit (1-9)</option>
                        <option value="2digit" selected>2 Digits (10-20)</option>
                    </select>
                </div>
            </div>

            <div class="problem-container">
                <div class="problem-display">
                    <div class="multiplication-row">
                        <div class="multiplication-number" id="firstNumber">0</div>
                    </div>
                    <div class="multiplication-row">
                        <span class="multiplication-operator">×</span>
                        <div class="multiplication-number" id="secondNumber">0</div>
                    </div>
                    <div class="answer-line">
                        <div class="answer-input-container">
                            <input type="number" 
                                   class="answer-input" 
                                   id="answerInput" 
                                   placeholder="?"
                                   autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="feedback" id="feedback"></div>
                <div class="correct-answer" id="correctAnswer"></div>
                <div class="explanation-panel" id="explanationPanel">
                    <div class="explanation-title">Step-by-Step Explanation</div>
                    <div id="explanationContent"></div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-submit" id="submitBtn" onclick="checkAnswer()">Submit</button>
                <button class="btn-explain" id="explainBtn" onclick="showExplanation()">Explain</button>
                <button class="btn-next" id="nextBtn" onclick="generateNewProblem()" style="display: none;">Next Problem</button>
                <button class="btn-new" onclick="resetGame()">New Game</button>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            if (tabName === 'learning') {
                document.getElementById('learningTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('practiceTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }

        // Learning Tab Variables
        let learningState = {
            selectedNumber: 0,
            currentGroup: 1,
            maxGroups: 20,
            selectedSymbol: 'dot'
        };

        function startLearning() {
            const selectedNum = parseInt(document.getElementById('learningNumber').value);
            if (!selectedNum) {
                document.getElementById('learningVisual').style.display = 'none';
                return;
            }

            learningState.selectedNumber = selectedNum;
            learningState.currentGroup = 1;
            learningState.maxGroups = 20;
            learningState.selectedSymbol = document.getElementById('symbolSelector').value;

            document.getElementById('learningVisual').style.display = 'block';
            showCurrentGroup();
        }

        function updateSymbol() {
            learningState.selectedSymbol = document.getElementById('symbolSelector').value;
            if (learningState.selectedNumber > 0) {
                showCurrentGroup();
            }
        }

        function showCurrentGroup() {
            const num = learningState.selectedNumber;
            const groupSize = learningState.currentGroup;
            const total = num * groupSize;

            // Update title
            document.getElementById('groupTitle').textContent = 
                `${num} groups of ${groupSize} = ${total}`;

            // Update equation
            document.getElementById('multiplicationEquation').textContent = 
                `${num} × ${groupSize} = ${total}`;

            // Create groups
            const container = document.getElementById('groupsContainer');
            container.innerHTML = '';

            // Calculate optimal dot size based on total items and screen space
            // More items = smaller dots
            let dotSize = 25; // Default size
            let gapSize = 5;
            
            if (total > 200) {
                dotSize = 8;
                gapSize = 2;
            } else if (total > 100) {
                dotSize = 10;
                gapSize = 2;
            } else if (total > 50) {
                dotSize = 12;
                gapSize = 3;
            } else if (total > 30) {
                dotSize = 15;
                gapSize = 3;
            } else if (total > 20) {
                dotSize = 18;
                gapSize = 4;
            } else if (total > 10) {
                dotSize = 20;
                gapSize = 4;
            }
            
            // Also consider individual group size for better fit
            if (groupSize > 15) {
                dotSize = Math.min(dotSize, 12);
                gapSize = Math.min(gapSize, 3);
            }
            if (groupSize > 20) {
                dotSize = Math.min(dotSize, 10);
                gapSize = Math.min(gapSize, 2);
            }

            const selectedSymbol = learningState.selectedSymbol;
            const useEmoji = selectedSymbol !== 'dot';

            for (let i = 1; i <= num; i++) {
                const groupBox = document.createElement('div');
                groupBox.className = 'group-box';
                
                const label = document.createElement('div');
                label.className = 'group-label';
                label.textContent = `Group ${i}`;
                
                const items = document.createElement('div');
                items.className = 'group-items';
                items.style.gap = gapSize + 'px';
                
                for (let j = 0; j < groupSize; j++) {
                    if (useEmoji) {
                        const emoji = document.createElement('div');
                        emoji.className = 'item-emoji';
                        emoji.textContent = selectedSymbol;
                        // For emojis, use font-size instead of width/height
                        emoji.style.fontSize = dotSize + 'px';
                        items.appendChild(emoji);
                    } else {
                        const dot = document.createElement('div');
                        dot.className = 'item-dot';
                        dot.style.width = dotSize + 'px';
                        dot.style.height = dotSize + 'px';
                        items.appendChild(dot);
                    }
                }
                
                groupBox.appendChild(label);
                groupBox.appendChild(items);
                container.appendChild(groupBox);
            }

            // Update info
            const info = document.getElementById('learningInfo');
            info.innerHTML = `
                <strong>What you see:</strong> ${num} groups, each with ${groupSize} items.<br>
                <strong>Total items:</strong> Count all the dots = <strong style="color: #f5576c; font-size: 1.2em;">${total}</strong>
            `;

            // Update navigation buttons
            document.getElementById('prevBtn').style.display = 
                learningState.currentGroup > 1 ? 'block' : 'none';
            document.getElementById('nextBtn').style.display = 
                learningState.currentGroup < learningState.maxGroups ? 'block' : 'none';
            
            if (learningState.currentGroup >= learningState.maxGroups) {
                document.getElementById('nextBtn').textContent = 'Done!';
                document.getElementById('nextBtn').disabled = true;
            } else {
                document.getElementById('nextBtn').textContent = 'Next';
                document.getElementById('nextBtn').disabled = false;
            }
        }

        function nextGroup() {
            if (learningState.currentGroup < learningState.maxGroups) {
                learningState.currentGroup++;
                showCurrentGroup();
            }
        }

        function previousGroup() {
            if (learningState.currentGroup > 1) {
                learningState.currentGroup--;
                showCurrentGroup();
            }
        }

        // Practice Tab Variables
        let currentProblem = {
            firstNumber: 0,
            secondNumber: 0,
            correctAnswer: 0
        };

        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let isAnswered = false;

        function generateNewProblem() {
            const digitType = document.getElementById('digitType').value;
            let num1, num2;

            if (digitType === '1digit') {
                // 1 digit: 1 to 9
                num1 = Math.floor(Math.random() * 9) + 1;
                num2 = Math.floor(Math.random() * 9) + 1;
            } else {
                // 2 digits: 10 to 20
                num1 = Math.floor(Math.random() * 11) + 10;
                num2 = Math.floor(Math.random() * 11) + 10;
            }

            const correctAnswer = num1 * num2;

            currentProblem = {
                firstNumber: num1,
                secondNumber: num2,
                correctAnswer: correctAnswer
            };

            // Update display
            document.getElementById('firstNumber').textContent = num1;
            document.getElementById('secondNumber').textContent = num2;

            // Reset UI
            const answerInput = document.getElementById('answerInput');
            answerInput.value = '';
            answerInput.disabled = false;
            answerInput.classList.remove('correct', 'incorrect');
            answerInput.focus();

            document.getElementById('feedback').className = 'feedback';
            document.getElementById('correctAnswer').textContent = '';
            document.getElementById('submitBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('explanationPanel').classList.remove('show');

            isAnswered = false;
        }

        function checkAnswer() {
            if (isAnswered) return;

            const userAnswer = parseInt(document.getElementById('answerInput').value);
            const answerInput = document.getElementById('answerInput');
            const feedback = document.getElementById('feedback');
            const correctAnswerDiv = document.getElementById('correctAnswer');
            const submitBtn = document.getElementById('submitBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (isNaN(userAnswer)) {
                alert('Please enter a number!');
                return;
            }

            isAnswered = true;
            answerInput.disabled = true;

            if (userAnswer === currentProblem.correctAnswer) {
                answerInput.classList.add('correct');
                feedback.textContent = '✓ Correct! +5 points';
                feedback.className = 'feedback correct';
                score += 5;
                correctCount++;
            } else {
                answerInput.classList.add('incorrect');
                feedback.textContent = '✗ Wrong! -2 points';
                feedback.className = 'feedback incorrect';
                correctAnswerDiv.textContent = `Correct answer: ${currentProblem.correctAnswer.toLocaleString()}`;
                score -= 2;
                wrongCount++;
                if (score < 0) score = 0;
            }

            updateScoreDisplay();
            submitBtn.style.display = 'none';
            nextBtn.style.display = 'block';
        }

        function updateScoreDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('wrong').textContent = wrongCount;
        }

        function resetGame() {
            score = 0;
            correctCount = 0;
            wrongCount = 0;
            updateScoreDisplay();
            generateNewProblem();
        }

        function createArrayGrid(rows, cols) {
            let html = '<div class="array-grid" style="grid-template-columns: repeat(' + cols + ', 1fr);">';
            for (let i = 0; i < rows * cols; i++) {
                html += '<div class="array-cell"></div>';
            }
            html += '</div>';
            return html;
        }

        function showExplanation() {
            const panel = document.getElementById('explanationPanel');
            const content = document.getElementById('explanationContent');
            const num1 = currentProblem.firstNumber;
            const num2 = currentProblem.secondNumber;
            const answer = currentProblem.correctAnswer;

            let html = '';

            // Step 1: Visual Array/Grid
            html += '<div class="explanation-step">';
            html += '<div class="explanation-step-title"><span class="step-number">1</span>Visual Array: Rows × Columns</div>';
            html += '<div class="explanation-step-content">';
            html += `<p><strong>${num1} × ${num2}</strong> means ${num1} rows with ${num2} items in each row, or ${num2} rows with ${num1} items in each row.</p>`;
            html += '<div class="array-label">' + num1 + ' rows × ' + num2 + ' columns = ' + answer + ' items</div>';
            html += createArrayGrid(num1, num2);
            html += '<p style="margin-top: 10px; text-align: center; font-weight: bold;">Count all the boxes: <strong style="color: #f5576c; font-size: 1.2em;">' + answer + '</strong></p>';
            html += '</div></div>';

            // Step 2: Repeated Addition
            html += '<div class="explanation-step">';
            html += '<div class="explanation-step-title"><span class="step-number">2</span>Repeated Addition</div>';
            html += '<div class="explanation-step-content">';
            html += `<p>Multiplication is the same as adding the same number multiple times:</p>`;
            html += '<div class="repeated-addition">';
            html += `<p><strong>${num1} × ${num2}</strong> means add ${num1}, ${num2} times:</p>`;
            const additions = [];
            for (let i = 0; i < num2; i++) {
                additions.push(num1);
            }
            html += '<div class="addition-step">' + additions.join(' + ') + '</div>';
            html += '<div class="addition-step" style="margin-top: 10px; font-weight: bold; color: #22543d;">= ' + answer + '</div>';
            html += '</div>';
            html += '</div></div>';

            // Step 3: Skip Counting
            html += '<div class="explanation-step">';
            html += '<div class="explanation-step-title"><span class="step-number">3</span>Skip Counting</div>';
            html += '<div class="explanation-step-content">';
            html += `<p>Count by ${num1}, ${num2} times:</p>`;
            html += '<div class="skip-counting">';
            const skipNumbers = [];
            for (let i = 1; i <= num2; i++) {
                skipNumbers.push(num1 * i);
            }
            html += skipNumbers.map((n, i) => {
                if (i === skipNumbers.length - 1) {
                    return '<span class="skip-number" style="background: #48bb78; font-size: 1.2em;">' + n + '</span>';
                }
                return '<span class="skip-number">' + n + '</span>';
            }).join('');
            html += '<p style="margin-top: 10px; font-weight: bold;">After ' + num2 + ' skips, we reach: <strong style="color: #22543d; font-size: 1.2em;">' + answer + '</strong></p>';
            html += '</div>';
            html += '</div></div>';

            // Step 4: Groups Visualization
            html += '<div class="explanation-step">';
            html += '<div class="explanation-step-title"><span class="step-number">4</span>Groups of Objects</div>';
            html += '<div class="explanation-step-content">';
            html += `<p>${num1} × ${num2} means ${num2} groups of ${num1} objects each:</p>`;
            html += '<div style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 15px 0;">';
            for (let group = 1; group <= num2; group++) {
                html += '<div style="text-align: center;">';
                html += '<div style="font-weight: bold; margin-bottom: 5px; color: #555;">Group ' + group + '</div>';
                html += '<div style="display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px; justify-content: center;">';
                for (let i = 0; i < num1; i++) {
                    html += '<div style="width: 20px; height: 20px; background: #f5576c; border-radius: 50%;"></div>';
                }
                html += '</div>';
                html += '<div style="font-size: 0.9em; color: #666; margin-top: 5px;">' + num1 + ' items</div>';
                html += '</div>';
            }
            html += '</div>';
            html += '<p style="text-align: center; margin-top: 15px; font-weight: bold;">Total: ' + num2 + ' groups × ' + num1 + ' items = <strong style="color: #f5576c; font-size: 1.3em;">' + answer + '</strong> items</p>';
            html += '</div></div>';

            // Final Answer
            html += '<div class="explanation-step" style="background: #d1fae5; border-left-color: #48bb78;">';
            html += '<div class="explanation-step-title">Final Answer</div>';
            html += `<div class="explanation-step-content" style="font-size: 1.4em; text-align: center; font-weight: bold; color: #22543d;">${num1} × ${num2} = ${answer}</div>`;
            html += '</div>';

            content.innerHTML = html;
            panel.classList.add('show');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Allow Enter key to submit
        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !isAnswered) {
                checkAnswer();
            }
        });

        // Generate new problem when digit type changes
        document.getElementById('digitType').addEventListener('change', function() {
            if (!isAnswered) {
                generateNewProblem();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            generateNewProblem();
        });
    </script>
</body>
</html>
